name: Python Flask CI
on:
  push:
    branches:
      - main
jobs:
  flask-ci-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Build Docker Image
        run: docker build -t flask-app .

      - name: Run Container
        run: docker run -d -p 5000:5000 --name flask-container flask-app

      - name: Smoke Test
        run: |
          sleep 5
          curl http://localhost:5000/health

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: docker tag flask-app ${{ secrets.DOCKERHUB_USERNAME }}/python-flask-app:v1.0.0
      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/python-flask-app:v1.0.0