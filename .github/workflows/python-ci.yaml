name: Python Flask CI

on:
  push:
    branches:
      - main

jobs:
  flask-ci-job:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v6

      # 2. Build Docker image
      - name: Build Docker Image
        run: |
          echo "Building Flask Docker image..."
          docker build -t flask-app:v1.0.0 .

      # 3. Start the container
      - name: Run Flask Container
        run: |
          echo "Starting Flask container..."
          docker run -d \
            -p 5000:5000 \
            --name flask-container \
            flask-app:v1.0.0

      # 4. Verify container is running
      - name: Verify Container
        run: |
          echo "Checking container status..."

          if [ "$(docker inspect -f '{{.State.Running}}' flask-container)" != "true" ]; then
            echo "❌ Flask container is not running."
            docker logs flask-container
            exit 1
          fi

          echo "✅ Flask container is running."

      # 5. Smoke test
      - name: Smoke Test
        run: |
          echo "Waiting for Flask application to start..."
          sleep 5

          echo "Testing health endpoint..."

          response=$(curl -s -w "\n%{http_code}" http://localhost:5000/health)

          body=$(echo "$response" | head -n 1)
          status_code=$(echo "$response" | tail -n 1)

          echo "HTTP Status Code: $status_code"
          echo "Response: $body"

          if [ "$status_code" != "200" ]; then
            echo "❌ Health check failed."
            docker logs flask-container
            exit 1
          fi

          if [[ "$body" != *"healthy"* ]]; then
            echo "❌ Application is not reporting a healthy status."
            exit 1
          fi

          echo "✅ Smoke test passed."

      # 6. Test the main application endpoint
      - name: Test Application Endpoint
        run: |
          echo "Testing main application endpoint..."

          response=$(curl -s -w "\n%{http_code}" http://localhost:5000/)

          body=$(echo "$response" | head -n 1)
          status_code=$(echo "$response" | tail -n 1)

          echo "HTTP Status Code: $status_code"
          echo "Response: $body"

          if [ "$status_code" != "200" ]; then
            echo "❌ Application endpoint failed."
            docker logs flask-container
            exit 1
          fi

          echo "✅ Application endpoint is working."

      # 7. Display logs for troubleshooting
      - name: Display Container Logs
        if: always()
        run: |
          echo "========== Flask Container Logs =========="
          docker logs flask-container

      # 8. Stop and remove test container
      - name: Cleanup Container
        if: always()
        run: |
          echo "Cleaning up test container..."
          docker stop flask-container || true
          docker rm flask-container || true

      # 9. Login to Docker Hub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 10. Tag image for Docker Hub
      - name: Tag Docker Image
        run: |
          docker tag \
            flask-app:v1.0.0 \
            ${{ secrets.DOCKERHUB_USERNAME }}/python-flask-app:v1.0.0

      # 11. Push tested image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/python-flask-app:v1.0.0